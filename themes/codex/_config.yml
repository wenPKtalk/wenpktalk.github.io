# codex — a minimal Hexo theme for technical writing with book/series indexing.
# Books are declared in source/_data/books.yml; articles join one with `book:` front matter.

# Header navigation: <language key under nav.*>: <url>
menu:
  home: /
  books: /books/
  categories: /categories/
  tags: /tags/
  archives: /archives/

# Shown on the home page; name/subtitle/description come from the site _config.yml
author:
  avatar: /images/avatar.jpg
  location: Xi'an, China
  links:
    GitHub: https://github.com/wenPKtalk
    Stack Overflow: https://stackoverflow.com/users/15967860/topsion

# On-page table of contents (h2..max_depth)
toc:
  max_depth: 3

# Titles for GitHub-style alerts (> [!NOTE] ...) that have no title of their own
callout_titles:
  note: 注
  tip: 提示
  important: 重要
  warning: 警告
  caution: 注意

# Comments stored in GitHub Discussions; IDs from https://giscus.app
# Needs Discussions enabled and the giscus app installed on the repo.
giscus:
  enable: true
  repo: wenPKtalk/wenpktalk.github.io
  repo_id: R_kgDOGqAqSQ
  # Announcement-type category: only maintainers and giscus can open discussions
  category: Announcements
  category_id: DIC_kwDOGqAqSc4DLBw3
  lang: zh-CN
