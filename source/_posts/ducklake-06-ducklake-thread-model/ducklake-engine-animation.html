<title>DuckLake 线程模型动画</title>
<style>
:root{--bg:#F8FAFC;--panel:#FFFFFF;--ink:#111827;--sub:#374151;--muted:#6B7280;--line:#E2E8F0;
--blue:#2563EB;--green:#15803D;--orange:#EA580C;--red:#B91C1C;--teal:#0F766E;--purple:#7E22CE;--amber:#B45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
header{max-width:1440px;margin:0 auto;padding:20px 16px 8px}
h1{font-size:22px;margin:0 0 6px}
.subtitle{color:var(--muted);font-size:13px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
main{max-width:1440px;margin:0 auto;padding:0 16px 24px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.stage svg{width:100%;height:auto;display:block}
.comp{transition:opacity .35s}
.comp.dim{opacity:.16}
.flow{opacity:.08;transition:opacity .35s}
.flow.on{opacity:1}
.cap{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:grid;grid-template-columns:1fr 340px;gap:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:12px;color:var(--sub);cursor:pointer}
.tabs button.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.count{font-size:12px;color:var(--muted)}
h2{font-size:17px;margin:4px 0 8px}
.body{font-size:14px;line-height:1.7;color:var(--sub);margin:0}
.src{margin-top:8px;font:12px "SF Mono",Menlo,Consolas,monospace;color:var(--muted)}
.myth{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;align-self:start}
.myth b{color:var(--red)}
.myth .w{color:var(--red)}.myth .r{color:#166534}
.myth.neutral{background:#F8FAFC;border-color:var(--line)}.myth.neutral b{color:var(--sub)}
.ctrl{display:flex;gap:8px;margin-top:12px;align-items:center}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
.ctrl button:hover{border-color:var(--blue)}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);transition:width .3s}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:860px){.cap{grid-template-columns:1fr}}
</style>
</head>

<script>
const STEPS = [{"ch": "全景", "t": "一个进程：两类线程池，DuckLake 接管 catalog 和事务", "b": "ATTACH 'ducklake:…' 之后，表长什么样、事务怎么提交由 DuckLake 的 Catalog / Transaction 接管；执行完全复用 DuckDB 的调度器，DuckLake <b>没有自己的线程池</b>。计算 task 跑在 REGULAR 池，I/O 跑在 ASYNC 池，每个连接的调用线程只跑自己查询的 task。", "src": "ducklake_extension.cpp · task_scheduler_type.hpp:15 · task_scheduler.cpp:156", "m": ["DuckLake 有自己的后台线程池在扫文件", "线程全是 DuckDB 的；DuckLake 唯一自己投任务的地方是提交重试时并行重写删除文件"], "on": ["caller", "sched", "rpool", "apool", "dl_txn", "cat", "obj"], "fl": []}, {"ch": "全景", "t": "元数据走每事务一条的内部连接，数据由 worker 直接读写", "b": "每个 DuckLake 事务懒创建<b>一条</b>内部 Connection，所有元数据 SQL 都经它执行（connection_lock 只保护创建）。推断：同一事务里多个线程同时发元数据查询，会在这条连接上排队。Parquet 则由 worker 直接读写 DATA_PATH，不经过 catalog。", "src": "ducklake_transaction.cpp:909 GetConnection · :1808 ExecuteRaw", "on": ["dl_txn", "dl_conn", "cat", "obj", "scan"], "fl": ["fl_txn_cat", "fl_obj_scan"]}, {"ch": "写入", "t": "INSERT：调用线程编译，计划切成两条 pipeline", "b": "内层 pipeline 的 sink 是 COPY（写 Parquet）；外层 pipeline 的 source 是 COPY 吐出的\"每个文件一行\"，sink 是 DuckLakeInsert。依赖满足的 pipeline 才拆 task，task 数 = min(MaxThreads, threads)。", "src": "ducklake_insert.cpp:794 PlanInsertPipeline · pipeline.cpp:127", "on": ["caller", "op_inline", "op_copy", "op_insert", "q_reg"], "fl": ["fl_caller_q"]}, {"ch": "写入", "t": "task 进 REGULAR 队列：worker 轮转取，调用线程只取自己的", "b": "Executor 用自己的 ProducerToken 把 task 放进自己的 lane。后台 worker 用 ConsumerToken 轮转取；调用线程循环取自己 lane 的 task，以 PROCESS_PARTIAL 跑一段就回来再取。", "src": "task_scheduler_queue.cpp:16 · executor.cpp:444 · client_context_execution.cpp:349", "on": ["q_reg", "rpool", "caller"], "fl": ["fl_q_pool", "fl_q_caller"], "set": {"w1t": "T1 · INSERT", "w2t": "T2 · INSERT", "w3t": "T3 · INSERT", "w4t": "T4 · INSERT"}}, {"ch": "写入", "t": "InlineData：小写入留在 catalog", "b": "每个线程先把行缓存在本地，全局行数计数器有锁保护。总数不超过 data_inlining_row_limit（默认 10）就整批 inline，提交时写进 inlined_data_&lt;表&gt;_&lt;版本&gt;；一旦超过，各线程把已缓存的行重新吐给下游 COPY。", "src": "ducklake_inline_data.cpp:42 AddRows · :130 FinalExecute", "m": ["INSERT 一定会生成 Parquet", "≤ 10 行默认 inline 进 catalog，对象存储那边零变化"], "on": ["op_inline", "c_inl", "rpool"], "fl": [], "set": {"w1t": "T1 · INSERT", "w2t": "T2 · INSERT", "w3t": "T3 · INSERT", "w4t": "T4 · INSERT"}}, {"ch": "写入", "t": "COPY：编码并行，追加串行", "b": "DuckLake 设了 rotate=true，DuckDB 因此不保序、选 PARALLEL_COPY_TO_FILE。每个 worker 并行 Prepare（把一批行编码成 row group），再在<b>单文件锁</b>下 Flush 追加。默认 per_thread_output=false：多个线程写的是<b>同一个</b>文件。", "src": "ducklake_insert.cpp:610 · plan_copy_to_file.cpp:28 · physical_copy_to_file.cpp:4200 / :4250", "m": ["每个线程各写一个 Parquet 文件", "默认多线程共写一个文件，超过 target_file_size 才换下一个"], "on": ["prep", "flush", "curfile", "rpool", "op_copy", "o_new"], "fl": ["fl_pool_wst", "fl_wst_obj"], "set": {"w1t": "T1 · INSERT", "w2t": "T2 · INSERT", "w3t": "T3 · INSERT", "w4t": "T4 · INSERT", "curfilet": "ducklake-a1.parquet（4 个线程在追加）"}}, {"ch": "写入", "t": "超过 target_file_size 就换文件；开关文件交给 ASYNC 池", "b": "Flush 前判断当前文件是否超过 target_file_size（默认 512MB），超过就换新文件、旧文件收尾。文件的打开、关闭、收尾作为生命周期任务投到 ASYNC 队列。带排序且未分区的表会退化成单线程 COPY。", "src": "physical_copy_to_file.cpp:318 · ducklake_insert.cpp:686 PreserveSortedOrder", "on": ["rotate", "curfile", "q_async", "apool", "o_new"], "fl": ["fl_qa_apool", "fl_wst_obj"], "set": {"w1t": "T1 · INSERT", "w2t": "T2 · INSERT", "w3t": "T3 · INSERT", "w4t": "T4 · INSERT", "curfilet": "ducklake-a2.parquet（a1 已写满、收尾中）", "o_newt": "a1、a2：提交前不可见", "a1t": "A1 · 关 a1", "a2t": "A2 · 开 a2"}}, {"ch": "写入", "t": "外层 pipeline：DuckLakeInsert 收文件清单", "b": "DuckLakeInsert 不是并行 sink，整条外层 pipeline 只有 1 个 task；但它每个文件只处理一行（路径、大小、行数、列统计），开销可以忽略。文件此刻已经在对象存储上，但 catalog 里还没有指向它的行，对任何人都不可见。", "src": "ducklake_insert.hpp:165 ParallelSink · ducklake_insert.cpp:170", "on": ["op_insert", "o_new", "dl_txn"], "fl": [], "set": {"o_newt": "a1、a2：提交前不可见", "w1t": "T1 · 外层 sink"}}, {"ch": "DELETE", "t": "DELETE：Sink 并行收集，Finalize 单线程写删除文件", "b": "扫描出要删的行后，各线程按文件攒行号（并进全局时加锁）。Finalize 只跑一次：逐个文件决定——整文件删光就直接丢掉，删得少就记成行内删除，否则写 delete file / puffin DV，<b>一个线程逐个写</b>。", "src": "ducklake_delete.cpp:363 Sink · :588 Finalize", "m": ["删除文件也是多线程并行写的", "只有收集行号是并行的；写文件在 Finalize 里串行"], "on": ["op_delete", "del_fin", "o_del", "rpool"], "fl": ["fl_pool_wst", "fl_del_obj"], "set": {"w1t": "T1 · Finalize", "w2t": "T2 · 空闲", "w3t": "T3 · 空闲", "w4t": "T4 · 空闲"}}, {"ch": "提交", "t": "COMMIT 在调用线程：一批 SQL 写进 catalog", "b": "提交在发起 COMMIT 的连接线程上执行：snapshot_id + 1，把新文件、删除、统计、inline 行和 snapshot_changes 拼成一批 SQL，经内部连接一次写进 catalog。<b>第一次尝试不查冲突</b>，直接写；写成功，新文件才对别人可见。", "src": "ducklake_transaction_state.cpp:2712 Commit · :2727", "on": ["caller", "dl_txn", "dl_conn", "cat", "o_new"], "fl": ["fl_caller_txn", "fl_txn_cat"], "set": {"o_newt": "a1、a2：提交成功后可见"}}, {"ch": "提交", "t": "撞主键 → sleep 退避 → 查冲突后重试", "b": "两个写者都写 snapshot_id = N+1，主键只让一个成功。失败方回滚，等 100ms × 1.5ⁱ × 随机 0.5–1——<b>sleep 阻塞的是这条连接线程</b>，不占 worker；之后对比 snapshot_changes 查冲突，用新 id 重写，最多重试 10 次。需要改提交快照的删除文件，由 TaskExecutor 并行重写。", "src": "ducklake_transaction_state.cpp:2801 sleep_for · ducklake_transaction.cpp:746", "m": ["提交前总会先检查冲突", "第一次直接写；只有撞主键后的重试才查冲突"], "on": ["caller", "c_snap", "c_chg", "dl_txn", "rpool"], "fl": ["fl_txn_cat"], "set": {"w1t": "T1 · 重写删除文件", "w2t": "T2 · 重写删除文件"}}, {"ch": "读取", "t": "扫描 pipeline 被调度时：单线程物化文件清单", "b": "不是在 planning 阶段。Pipeline::Schedule → Reset → 扫描的 InitializeGlobalState 里，DuckLake 查一次 catalog：这个快照下存活的文件，按列级 min/max 剪掉整文件，inlined 表作为\"伪文件\"混进清单。源码注释：放在这里是为了避免 worker 一起挤在 GetFiles() 的锁上。", "src": "ducklake_multi_file_reader.cpp:288 · pipeline.cpp:323", "m": ["文件清单在 planning 阶段就查好", "扫描所在 pipeline 被调度时才查，由调度它的那个线程执行"], "on": ["scan", "cat", "dl_conn"], "fl": ["fl_cat_scan", "fl_txn_cat"]}, {"ch": "读取", "t": "起 threads 个 task：DuckLake 不限扫描并行度", "b": "DuckLake 的文件清单固定报 MULTIPLE_FILES，Parquet 因此不给 MaxThreads 设上限，这条 pipeline 直接拆成 threads 个 task。小表也一样，多出来的 task 领不到活就立刻结束。", "src": "ducklake_multi_file_list.cpp:443 · parquet_multi_file_info.cpp:423", "on": ["q_reg", "rpool", "op_scan"], "fl": ["fl_q_pool"], "set": {"w1t": "T1 · scan", "w2t": "T2 · scan", "w3t": "T3 · scan", "w4t": "T4 · scan"}}, {"ch": "读取", "t": "按 row group 领活：全局锁下 row_group_index++", "b": "每个 task 要活时拿 gstate.lock：当前文件还有 row group，就 row_group_index++ 领走一个——一个 row group 就是一个 scan job。T1、T2、T3 同时待在 file0 里，各扫一块。", "src": "multi_file_function.hpp:678 ClaimNextJobInternal · parquet_multi_file_info.cpp:592", "m": ["一个文件一个线程", "领活单位是 row group；大文件里多个线程同时扫"], "on": ["gs_lock", "gs_rgidx", "f0rg0", "f0rg1", "f0rg2", "rpool", "o_f0"], "fl": ["fl_pool_scan", "fl_obj_scan"], "set": {"w1t": "T1 · f0·RG0", "w2t": "T2 · f0·RG1", "w3t": "T3 · f0·RG2", "f0rg0t": "RG0 · T1", "f0rg1t": "RG1 · T2", "f0rg2t": "RG2 · T3", "gs_rgidxt": "row_group_index = 3", "w4t": "T4 · 要活中"}}, {"ch": "读取", "t": "file0 领完才轮到 file1；后面的文件已提前打开", "b": "T4 来要活时 file0 已没有可领的 row group，于是 file_index++ 换到 file1。read-ahead（默认开）已在 ASYNC 池把后面的文件提前打开，换文件不必现开。文件按顺序推进，已领走的 row group 可以同时解码。", "src": "multi_file_function.hpp:461 ScheduleFileOpens · scan_read_ahead.cpp:144", "on": ["gs_fidx", "f1rg0", "f2rg0", "apool", "o_f1", "o_f2", "rpool"], "fl": ["fl_apool_scan", "fl_obj_scan"], "set": {"w1t": "T1 · f0·RG0", "w2t": "T2 · f0·RG1", "w3t": "T3 · f0·RG2", "f0rg0t": "RG0 · T1", "f0rg1t": "RG1 · T2", "f0rg2t": "RG2 · T3", "gs_rgidxt": "row_group_index = 1", "w4t": "T4 · f1·RG0", "f1rg0t": "RG0 · T4", "gs_fidxt": "file_index = 1", "a1t": "A1 · 开 file2"}}, {"ch": "读取", "t": "列块没就绪：投 I/O task，自己挂起", "b": "scan job 的列块读取被包装成异步任务投进 ASYNC 队列，扫描 task 返回 BLOCKED、Deschedule 让出线程；I/O 全部完成后它被唤醒、重新入队。REGULAR worker 空闲时也会顺手做 ASYNC 队列里的 I/O。", "src": "parquet_reader.cpp:2363 / :2488 · task_scheduler.cpp:156", "m": ["等 I/O 时 worker 线程在干等", "task 挂起让出线程；I/O 在 ASYNC 池做完再唤醒它"], "on": ["q_async", "apool", "rpool", "obj"], "fl": ["fl_pool_qa", "fl_qa_apool", "fl_obj_scan"], "set": {"w1t": "T1 · f0·RG0", "w2t": "T2 · 挂起等 I/O", "w3t": "T3 · f0·RG2", "f0rg0t": "RG0 · T1", "f0rg1t": "RG1 · T2", "f0rg2t": "RG2 · T3", "gs_rgidxt": "row_group_index = 3", "w4t": "T4 · f1·RG0", "a2t": "A2 · 读列块", "a3t": "A3 · 读列块"}}, {"ch": "读取", "t": "删除过滤：打开数据文件的线程顺手读删除文件", "b": "InitializeReader 打开数据文件时，如果它有 delete file / puffin DV，就同步读进来建 DeleteFilter；行内删除则直接来自文件清单查询的结果。开了 read-ahead 时，这一步发生在 ASYNC 池线程上。", "src": "ducklake_multi_file_reader.cpp:304 InitializeReader · ducklake_delete_filter.cpp:139", "on": ["delf", "o_del", "apool"], "fl": ["fl_apool_scan", "fl_obj_scan"], "set": {"a1t": "A1 · 读删除文件"}}, {"ch": "读取", "t": "inlined 表：1 个 job，查元数据时还握着扫描锁", "b": "清单里的 inlined 伪文件只算<b>一个</b> job，只有一个线程读。它的元数据 SQL 在 TryInitializeScan 里执行，而 DuckDB 调 TryInitializeScan 时持有 gstate.lock——这条查询跑完前，同一扫描的其它线程都领不到活。inline 行积多了，要及时 flush_inlined_data。", "src": "ducklake_inlined_data_reader.cpp:125 · multi_file_function.hpp:700", "on": ["inl_job", "gs_lock", "dl_conn", "c_inl", "rpool"], "fl": ["fl_cat_scan", "fl_txn_cat"], "set": {"w1t": "T1 · 读 inlined", "w2t": "T2 · 等锁", "w3t": "T3 · 等锁", "w4t": "T4 · 等锁"}}, {"ch": "调度与收尾", "t": "Combine 各做各的，Finalize 是一个 task", "b": "每个 task 领不到活就在自己线程上 Combine，把局部态并进全局（带锁）。最后一个完成的 task 只负责把 event 计数推到总数，随后往 lane 里投 1 个 PipelineFinishTask——谁先取到谁执行 Finalize（单线程），下游 pipeline 再被调度。", "src": "pipeline_executor.cpp:702 · event.cpp:56 · pipeline_finish_event.cpp:79", "m": ["Finalize 由最后完成的那个 worker 当场执行", "它是新投进 lane 的一个 task，任意 worker 或调用线程都可能取到"], "on": ["op_fin", "q_reg", "rpool", "caller"], "fl": ["fl_q_pool", "fl_q_caller"], "set": {"w3t": "T3 · Finalize"}}, {"ch": "调度与收尾", "t": "多查询：轮转保证轮得到，不保证有 worker", "b": "worker 每从一条 lane 取满 16 个 task 就整体换下一条，各查询都轮得到；但 task 跑完或阻塞才放手，长 task 照样占着线程。新查询的调用线程会立刻跑自己 lane 的 task，所以它至少以并行度 1 推进。", "src": "task_scheduler_queue.cpp:16 · concurrentqueue.h:1106 · client_context_execution.cpp:349", "m": ["积压多的查询优先被取（全局挑最满的 lane）", "v2.0 前：只扫最新的前 3 条 producer、挑其中最大的 → 新查询插队、老查询饿死；v2.0（#26809）改成配额 256→16 的 ConsumerToken 轮转"], "on": ["q_reg", "rpool", "caller"], "fl": ["fl_q_pool", "fl_q_caller"]}, {"ch": "调度与收尾", "t": "串行点汇总", "b": "把并行拆开看，一次只能一个线程过的地方是：扫描全局锁（领 row group、读 inlined 表）、单文件锁（Flush 追加）、DELETE 的 Finalize、外层 DuckLakeInsert、每事务一条的内部元数据连接，以及 COMMIT 所在的调用线程。调优先看这几处。", "src": "详见 ducklake-knowledge-base.md §5.1", "on": ["gs_lock", "inl_job", "flush", "del_fin", "op_insert", "dl_conn", "caller"], "fl": []}];
const svg = document.querySelector('.stage svg');
const comps = [...svg.querySelectorAll('.comp')];
const flows = [...svg.querySelectorAll('.flow')];
const defaults = {};
svg.querySelectorAll('text[id]').forEach(t => { defaults[t.id] = t.textContent; });
const chapters = [...new Set(STEPS.map(s => s.ch))];
let cur = 0, timer = null, tokens = [];
try { const saved = parseInt(localStorage.getItem('dl-anim-step'), 10); if (saved >= 0 && saved < STEPS.length) cur = saved; } catch (e) {}

const tabs = document.getElementById('tabs');
chapters.forEach(ch => {
  const b = document.createElement('button');
  b.textContent = ch;
  b.onclick = () => go(STEPS.findIndex(s => s.ch === ch));
  tabs.appendChild(b);
});

function related(el, onEls) {
  return onEls.some(o => o === el || o.contains(el) || el.contains(o));
}

function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  const onEls = s.on.map(id => document.getElementById(id)).filter(Boolean);
  comps.forEach(c => c.classList.toggle('dim', onEls.length > 0 && !related(c, onEls)));
  flows.forEach(f => f.classList.toggle('on', s.fl.includes(f.id)));
  Object.keys(defaults).forEach(id => { document.getElementById(id).textContent = (s.set && s.set[id]) || defaults[id]; });
  tokens.forEach(t => t.el.remove());
  tokens = [];
  s.fl.forEach(fid => {
    const p = document.getElementById(fid);
    for (let k = 0; k < 3; k++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', 4.5);
      c.setAttribute('fill', p.dataset.color);
      svg.appendChild(c);
      tokens.push({ el: c, path: p, len: p.getTotalLength(), off: k / 3 });
    }
  });
  document.querySelectorAll('#tabs button').forEach((b, k) => b.classList.toggle('cur', chapters[k] === s.ch));
  document.getElementById('count').textContent = `第 ${cur + 1} / ${STEPS.length} 步 · ${s.ch}`;
  document.getElementById('title').textContent = s.t;
  document.getElementById('body').innerHTML = s.b;
  document.getElementById('src').textContent = '源码：' + s.src;
  document.getElementById('myth').classList.toggle('neutral', !s.m);
  document.getElementById('myth').innerHTML = s.m
    ? `<b>常见误区</b><br><span class="w">✗ ${s.m[0]}</span><br><span class="r">✓ ${s.m[1]}</span>`
    : '<b>这一步看什么</b><br>亮起的组件和流动的点就是这一步涉及的线程与数据；其余组件变暗。';
  document.getElementById('bar').style.width = ((cur + 1) / STEPS.length * 100) + '%';
  try { localStorage.setItem('dl-anim-step', String(cur)); } catch (e) {}
}

function tick(ts) {
  tokens.forEach(t => {
    const dur = Math.max(1200, t.len * 9);
    const pos = (((ts / dur) + t.off) % 1) * t.len;
    const pt = t.path.getPointAtLength(pos);
    t.el.setAttribute('cx', pt.x);
    t.el.setAttribute('cy', pt.y);
  });
  requestAnimationFrame(tick);
}

function togglePlay() {
  const btn = document.getElementById('play');
  if (timer) { clearInterval(timer); timer = null; btn.textContent = '▶ 自动播放'; return; }
  btn.textContent = '❚❚ 暂停';
  timer = setInterval(() => { if (cur >= STEPS.length - 1) { togglePlay(); return; } go(cur + 1); }, 7000);
}

document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('play').onclick = togglePlay;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(STEPS.length - 1);
});
go(cur);
requestAnimationFrame(tick);
</script>
</body>
</html>
