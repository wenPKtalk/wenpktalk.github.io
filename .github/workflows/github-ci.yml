name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push supersedes an in-flight deploy; both force-push gh-pages.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Post dates in source/_posts are written in China time.
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            themes/tranquilpeak/package-lock.json

      - name: Build theme assets
        working-directory: themes/tranquilpeak
        run: |
          npm ci
          npm run prod

      - name: Install site dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "topsion"
          git config --global user.email "wensir_top@163.com"
          # deploy.repo in _config.yml is an SSH URL; push over HTTPS with the job token instead
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          npx hexo deploy
