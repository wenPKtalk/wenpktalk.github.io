  <h1 class="article-title">Java如何断言集合结果集</h1>
  
  
    <p class="article-meta">
      <time datetime="2022-04-07T02:46:27.000Z">2022-04-07</time>
      <span>· 约 3 分钟</span>
      
        · <a href="/categories/Unit-Test/">Unit Test</a>
      
      
        <a class="badge" href="/tags/Unit-Test/">Unit Test</a>
      
    </p>
  
</header>

    <div class="article-content"><h3 id="场景"><a href="#场景" class="headerlink" title="场景"></a>场景</h3><p>当被测试方法返回结果是集合，我们应该使用哪个断言，如果一个一个元素比较会比较麻烦。所以使用其他包下的断言。</p>
<h3 id="代码示例"><a href="#代码示例" class="headerlink" title="代码示例"></a>代码示例</h3><p>被测试代码如下，是一组经典的合并两个Map&lt;String, List<Object>&gt;的代码(可以直接使用当成工具方法，注意引入Guava包)：</p>
<figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">public</span> <span class="type">Map</span>&lt;String, List&lt;Object&gt;&gt; <span class="title function_">mergeTwoGroupedMapCollection</span><span class="params">(Map&lt;String, List&lt;Object&gt;&gt; groupedCollectionOne,</span></span><br><span class="line"><span class="params">                                                     Map&lt;String, List&lt;Object&gt;&gt; groupedCollectionTwo)</span> &#123;</span><br><span class="line">        <span class="type">Map</span>&lt;String, List&lt;Object&gt;&gt; <span class="variable">mapGlobal</span> <span class="operator">=</span> Maps.newHashMap();</span><br><span class="line">        mapGlobal.putAll(groupedCollectionOne);</span><br><span class="line">        groupedCollectionTwo.forEach((k, v) -&gt; mapGlobal.merge(k, v, (v1, v2) -&gt; &#123;</span><br><span class="line">            <span class="type">List</span>&lt;Object&gt; <span class="variable">data</span> <span class="operator">=</span> <span class="keyword">new</span> <span class="title class_">ArrayList</span>&lt;&gt;(v1);</span><br><span class="line">            data.addAll(v2);</span><br><span class="line">            <span class="keyword">return</span> <span class="keyword">new</span> <span class="title class_">ArrayList</span>&lt;&gt;(data);</span><br><span class="line">        &#125;));</span><br><span class="line">        <span class="keyword">return</span> mapGlobal;</span><br><span class="line">    &#125;</span><br></pre></td></tr></table></figure>



<p>测试如下：</p>
<figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> <span class="keyword">static</span> org.junit.jupiter.api.Assertions.assertAll;</span><br><span class="line"><span class="keyword">import</span> <span class="keyword">static</span> org.junit.jupiter.api.Assertions.assertIterableEquals;</span><br><span class="line"></span><br><span class="line">    <span class="meta">@Test</span></span><br><span class="line">    <span class="meta">@DisplayName(&quot;should merge multiple map when given two map has grouped by&quot;)</span></span><br><span class="line">    <span class="type">void</span> <span class="title function_">mergeTwoGroupedMapCollection</span><span class="params">()</span> &#123;</span><br><span class="line">        <span class="type">MergedCollection</span> <span class="variable">mergedCollection</span> <span class="operator">=</span> MergedCollection.builder().build();</span><br><span class="line">        <span class="type">Map</span>&lt;String, List&lt;Object&gt;&gt; <span class="variable">groupedOne</span> <span class="operator">=</span> Maps.newHashMap();</span><br><span class="line">        groupedOne.put(<span class="string">&quot;a&quot;</span>, Lists.newArrayList(<span class="string">&quot;a1&quot;</span>, <span class="string">&quot;a2&quot;</span>, <span class="string">&quot;a3&quot;</span>));</span><br><span class="line">        groupedOne.put(<span class="string">&quot;b&quot;</span>, Lists.newArrayList(<span class="string">&quot;b1&quot;</span>, <span class="string">&quot;b2&quot;</span>, <span class="string">&quot;b3&quot;</span>));</span><br><span class="line">        groupedOne.put(<span class="string">&quot;c&quot;</span>, Lists.newArrayList(<span class="string">&quot;c1&quot;</span>, <span class="string">&quot;c2&quot;</span>, <span class="string">&quot;c3&quot;</span>));</span><br><span class="line"></span><br><span class="line">        <span class="type">Map</span>&lt;String, List&lt;Object&gt;&gt; <span class="variable">groupedTwo</span> <span class="operator">=</span> Maps.newHashMap();</span><br><span class="line">        groupedTwo.put(<span class="string">&quot;c&quot;</span>, Lists.newArrayList(<span class="string">&quot;c3&quot;</span>, <span class="string">&quot;c4&quot;</span>, <span class="string">&quot;c5&quot;</span>, <span class="string">&quot;c6&quot;</span>, <span class="string">&quot;c7&quot;</span>));</span><br><span class="line"></span><br><span class="line">        <span class="type">Map</span>&lt;String, List&lt;Object&gt;&gt; <span class="variable">newGrouped</span> <span class="operator">=</span> mergedCollection.mergeTwoGroupedMapCollection(groupedOne, groupedTwo);</span><br><span class="line">        <span class="type">List</span>&lt;Object&gt; <span class="variable">except_a</span> <span class="operator">=</span> ImmutableList.of(<span class="string">&quot;a1&quot;</span>, <span class="string">&quot;a2&quot;</span>, <span class="string">&quot;a3&quot;</span>);</span><br><span class="line">        <span class="type">List</span>&lt;Object&gt; <span class="variable">except_b</span> <span class="operator">=</span> ImmutableList.of(<span class="string">&quot;b1&quot;</span>, <span class="string">&quot;b2&quot;</span>, <span class="string">&quot;b3&quot;</span>);</span><br><span class="line">        <span class="type">List</span>&lt;Object&gt; <span class="variable">except_c</span> <span class="operator">=</span> ImmutableList.of(<span class="string">&quot;c1&quot;</span>, <span class="string">&quot;c2&quot;</span>, <span class="string">&quot;c3&quot;</span>, <span class="string">&quot;c3&quot;</span>, <span class="string">&quot;c4&quot;</span>, <span class="string">&quot;c5&quot;</span>, <span class="string">&quot;c6&quot;</span>, <span class="string">&quot;c7&quot;</span>);</span><br><span class="line">        assertAll(<span class="string">&quot;all elements&quot;</span>,</span><br><span class="line">                ()-&gt;assertIterableEquals(except_a, newGrouped.get(<span class="string">&quot;a&quot;</span>)),</span><br><span class="line">                ()-&gt;assertIterableEquals(except_b, newGrouped.get(<span class="string">&quot;b&quot;</span>)),</span><br><span class="line">                ()-&gt;assertIterableEquals(except_c, newGrouped.get(<span class="string">&quot;c&quot;</span>))</span><br><span class="line">        );</span><br></pre></td></tr></table></figure>



<h3 id="总结"><a href="#总结" class="headerlink" title="总结"></a>总结</h3><p>对于这种工具性的方法，必须添加更小粒度的测试。以便于在重构的时候能够保证代码正确性，和理解上下文逻辑。哪如果是私有方法呢？<strong>测试大于封装</strong></p>
